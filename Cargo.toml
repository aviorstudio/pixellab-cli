[package]
name = "pxlb"
version = "0.0.0"
edition = "2024"
rust-version = "1.94"

[dependencies]
base64 = "=0.23.1"
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "rustls-no-provider", "query"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[profile.release]
lto = "thin"
strip = true
